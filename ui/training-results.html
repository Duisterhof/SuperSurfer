<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafbfc;color:#243247;font:14px/1.5 system-ui}main{padding:20px;max-width:1600px;margin:auto}h1{font-size:24px;margin:0}p{margin:8px 0;color:#526176}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:16px 0;padding:10px 12px;background:white;border:1px solid #dee5ed;border-radius:8px}label{display:flex;align-items:center;gap:7px}button,select{font:inherit;padding:5px 9px;border:1px solid #cbd5e1;background:white;border-radius:5px;color:inherit;cursor:pointer}input[type=range]{width:100px}.grid{display:grid;grid-template-columns:repeat(var(--columns,2),minmax(0,1fr));gap:16px}.panel{min-width:0;background:white;border:1px solid #dce4ed;border-radius:8px;overflow:hidden}.panel-header{display:flex;gap:8px;padding:10px 12px;align-items:center}.panel-header h2{font-size:15px;margin:0;flex:1}.chart{height:var(--chart-height,340px)}.caption,.missing{padding:0 14px 12px;font-size:12px;color:#526176}.missing{color:#875c20}.chart-wait{padding:24px;color:#526176}.expanded{position:fixed;inset:12px;z-index:10;box-shadow:0 0 0 100vmax #1b283960;display:flex;flex-direction:column}.expanded .chart{flex:1;min-height:200px}body:has(.expanded){overflow:hidden}details{margin-top:20px}summary{cursor:pointer;font-weight:600;margin-bottom:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}a{color:#2464c3}#freshness{min-height:22px}#gaps{border-left:3px solid #b1bdce;padding-left:12px}#domain-details:empty{display:none}#domain-details{margin-top:24px}#sources{margin-top:24px;border-top:1px solid #dce4ed;padding-top:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}main{padding:12px}.chart{height:330px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><h1>{{TITLE}}</h1><p>{{DESCRIPTION}}</p><p id="freshness" role="status">Connecting to live W&amp;B data…</p>
<div class="controls"><button id="refresh">Refresh W&amp;B</button><label>Y scale <select id="scale"><option value="linear">Linear</option><option value="log">Log</option></select></label><label>Smoothing <input id="smoothing" type="range" min="0" max=".95" step=".05" value="0"><output id="smoothing-value">0</output></label><label>Columns <select id="columns"><option>1</option><option selected>2</option><option>3</option></select></label><button id="reset">Reset zoom</button></div>
<p>Scroll to zoom · drag to pan · hover for raw values and sample time · click a legend to hide a trace.</p><div id="plots" class="grid"></div><p id="gaps" hidden></p><details id="secondary" hidden><summary>Additional measurements</summary><div id="secondary-plots" class="grid"></div></details><section id="domain-details">{{DETAILS}}</section><details id="sources"><summary>Sources and interpretation</summary><div id="source-links"></div><p id="provenance-note"></p><pre id="provenance"></pre></details></main>
<script type="application/json" id="training-spec">{{SPEC}}</script><script>{{PLOTLY}}</script><script>{{RENDERER}}</script></body></html>
