<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SuperSurfer</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/floating.css">
</head>
<body>
  <div class="workspace-landscape" aria-hidden="true"><div class="workspace-wave"></div></div>
  <div class="app-shell">
    <header class="topbar"><div id="breadcrumb" class="breadcrumb">Workspace</div><div class="topbar-actions"><span class="remote-pill"><span data-icon="server"></span>Connected workspace</span><button class="icon-button" id="new-workspace-window" data-action="new-window" title="New workspace window (⌘⇧N / Ctrl⇧N)" aria-label="New workspace window" hidden><span data-icon="plus"></span></button><button class="icon-button" id="chat-toggle" data-action="toggle-chat" aria-label="Toggle agent panel" title="Toggle agent panel"><span data-icon="panel"></span></button></div></header>
    <aside class="sidebar" aria-label="Workspace navigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 21c5-1 5-12 12-12 5 0 5 7 10 7M4 27c8 0 10-12 16-12 5 0 5 6 9 6"/></svg></span><strong>SuperSurfer</strong><span class="version">PREVIEW</span></div>
      <button class="quick-jump" data-action="jump"><span data-icon="search"></span><span>Go to anything</span><kbd>⌘ K</kbd></button>
      <nav class="global-nav"><button data-view="workspace"><span data-icon="layers"></span>Workspace</button><button data-view="compute"><span data-icon="cpu"></span>Compute<span id="queue-count" class="nav-count"></span></button></nav>
      <div class="nav-section-title"><span>PROJECTS</span><button class="icon-button" data-action="add-project" aria-label="Add project" title="Add project"><span data-icon="plus"></span></button></div>
      <div id="project-tree" class="project-tree"><div class="sidebar-placeholder">Loading your workspace…</div></div>
      <div class="sidebar-footer"><button data-view="settings"><span data-icon="settings"></span>Settings</button><div class="remote-status"><span id="connection-dot" class="status-dot unknown"></span><span id="connection-label">Connecting to workspace</span><button class="icon-button" data-action="refresh" title="Refresh" aria-label="Refresh connection"><span data-icon="refresh"></span></button></div></div>
    </aside>
    <div class="workspace">

      <div id="connection-banner" class="connection-banner" role="status" hidden></div>
      <div class="workspace-body"><main id="main" class="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span><p>Connecting to your workspace</p></div></main>
        <div id="chat-resizer" class="chat-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize agent panel" title="Drag to resize, or use Left and Right arrow keys"></div><aside id="chat-panel" class="chat-panel" aria-label="Agent conversation"><section id="chat-agent-list" class="chat-agent-list" aria-label="Agents"></section><div class="chat-header"><div class="chat-heading"><span class="agent-orb"><span data-icon="spark"></span></span><div><strong id="chat-name">Research lead</strong><div id="chat-meta" class="muted small">Project conversation</div></div><div class="chat-header-actions"><button id="chat-archive" class="icon-button" data-action="archive-agent" aria-label="Archive agent chat" title="Archive chat · existing work and monitoring continue"><span data-icon="archive"></span></button><button id="chat-rename" class="icon-button" data-action="rename-agent" aria-label="Rename agent" title="Rename agent"><span data-icon="edit"></span></button><button id="chat-maximize" class="icon-button" data-action="maximize-chat" aria-label="Maximize agent chat" title="Maximize agent chat"><span data-icon="maximize"></span></button><button class="icon-button" data-action="toggle-chat" aria-label="Close agent panel"><span data-icon="close"></span></button></div></div><div id="chat-policy" class="chat-policy">Ideas are suggestions. You decide what runs.</div></div><div id="chat-session-state" class="chat-session-state" hidden></div><section id="chat-tasks" class="chat-tasks" aria-label="Agent deliverables" hidden></section><div id="chat-messages" class="chat-messages" aria-live="polite"></div><section id="chat-approvals" class="chat-approvals" aria-label="Pending agent approvals" aria-live="polite" hidden></section><section id="chat-questions" class="chat-questions" aria-label="Agent questions" hidden></section><form id="chat-form" class="chat-composer"><label class="visually-hidden" for="chat-input">Message your agent</label><textarea id="chat-input" rows="1" placeholder="Ask about this experiment…"></textarea><div id="chat-preferences" class="chat-preferences" aria-label="Conversation model settings"></div><div class="composer-footer"><span id="chat-hint">Enter to send · Shift Enter for a new line</span><button id="chat-send" class="send-button" type="submit" aria-label="Send message"><span data-icon="arrowUp"></span></button><button id="chat-stop" class="composer-stop" type="button" data-action="stop-chat" aria-label="Stop current work" title="Stop current work" hidden><span data-icon="stop"></span></button></div><div id="chat-preference-notices" class="composer-notices" aria-live="polite" hidden></div></form><div class="chat-footnote">Saved in your workspace.</div></aside>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <script src="/vendor/katex/katex.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
