name: Bug report
description: Report a reproducible SuperSurfer problem with diagnostic evidence.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected, what happened, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SuperSurfer version and operating system
      placeholder: "0.1.24, macOS arm64 client, Linux workspace"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Markdown attachment
      description: In the project Activity tab, choose Export diagnostics, or ask its agent to export_diagnostics. Review the Markdown for private information, then drag the .md file here. Do not upload tokens or account files.
      placeholder: "Attach supersurfer-project-diagnostics.md here."
    validations:
      required: true
  - type: checkboxes
    id: reviewed
    attributes:
      label: Privacy review
      options:
        - label: I reviewed the attached diagnostic report and removed private information before sharing it.
          required: true
