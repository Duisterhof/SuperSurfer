name: Native Mac build
on:
  pull_request:
    paths:
      - '.github/workflows/mac-build.yml'
      - 'scripts/package.cjs'
      - 'desktop/**'
      - 'tests/mac-package.electron.cjs'
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-package:
    name: Mac package and startup (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build, verify local signature and open original/extracted ZIP
        run: |
          export SUPERSURFER_ARCH="${{ matrix.arch }}"
          test "$(node -p 'process.arch')" = "$SUPERSURFER_ARCH"
          npm run package:mac
          node tests/mac-package.electron.cjs
      - name: Retain verified Mac package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supersurfer-mac-${{ matrix.arch }}
          path: dist/SuperSurfer-*-mac-*.zip
          if-no-files-found: error
          retention-days: 7
